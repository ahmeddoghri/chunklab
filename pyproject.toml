[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunklab"
version = "0.1.0"
description = "Your RAG is only as good as how you cut up the documents. A reproducible benchmark of chunking strategies on a retrieval task with known answer spans."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Doghri" }]
keywords = ["llm", "rag", "chunking", "retrieval", "text-splitting", "benchmark", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ahmeddoghri/chunklab"

[tool.hatch.build.targets.wheel]
packages = ["chunklab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
